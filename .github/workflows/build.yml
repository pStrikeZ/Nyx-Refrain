# Full builds with scripts/build.sh (all five targets, NSIS installers, deb/rpm/Arch).
# - Manual run (intended for the dev branch): artifacts only; the version string carries
#   the commit hash, e.g. v0.9.1-g1a2b3c4.
# - Pushing a v* tag: same build with the clean version, then a draft GitHub Release with
#   the installers and packages attached.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: the version string checks whether HEAD is the release tag,
      # and the Linux packages take their timestamp from the last commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-gnu, aarch64-pc-windows-gnullvm, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, loongarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # llvm: build.sh inspects Windows DLL imports with llvm-readobj; GNU objdump
          # cannot read ARM64 PE files.
          sudo apt-get install -y nsis libarchive-tools desktop-file-utils llvm

      # package-linux.sh uses the git identity as the package maintainer.
      - name: Set packaging identity from the last commit
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"

      - name: Build
        run: ./scripts/build.sh

      # One artifact per architecture: its binaries and license files, its installer or
      # distro packages, and a SHA256SUMS covering just those files.
      - name: Stage per-architecture artifacts
        id: stage
        run: |
          shopt -s nullglob
          # The version string baked into the binaries, e.g. v0.9.1 or v0.9.1-g1a2b3c4.
          version="$(dist/linux-x86_64/nyxr --version | awk '{print $2}')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          declare -A packages=(
            [win32-amd64]="*-windows-x86_64-setup.exe"
            [win32-aarch64]="*-windows-arm64-setup.exe"
            [linux-x86_64]="*_amd64.deb *.x86_64.rpm *-x86_64.pkg.tar.zst"
            [linux-aarch64]="*_arm64.deb *.aarch64.rpm *-aarch64.pkg.tar.zst"
            [linux-loongarch64]="*_loong64.deb *.loongarch64.rpm *-loong64.pkg.tar.zst"
          )
          for arch in "${!packages[@]}"; do
            out="staging/${arch}"
            mkdir -p "${out}"
            cp -a "dist/${arch}/." "${out}/"
            matched=0
            read -ra patterns <<< "${packages[${arch}]}"  # split without glob expansion
            for pattern in "${patterns[@]}"; do
              for f in dist/packages/${pattern}; do
                cp -a "${f}" "${out}/"
                matched=$((matched + 1))
              done
            done
            if [[ "${matched}" -eq 0 ]]; then
              echo "::error::no packages found for ${arch}"
              exit 1
            fi
            (cd "${out}" && sha256sum -- * > SHA256SUMS)
            echo "${arch}:"; ls -l "${out}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-refrain-${{ steps.stage.outputs.version }}-win32-amd64
          path: staging/win32-amd64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-refrain-${{ steps.stage.outputs.version }}-win32-aarch64
          path: staging/win32-aarch64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-refrain-${{ steps.stage.outputs.version }}-linux-x86_64
          path: staging/linux-x86_64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-refrain-${{ steps.stage.outputs.version }}-linux-aarch64
          path: staging/linux-aarch64/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-refrain-${{ steps.stage.outputs.version }}-linux-loongarch64
          path: staging/linux-loongarch64/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Each artifact lands in dist/<artifact name>/.
      - uses: actions/download-artifact@v4
        with:
          pattern: nyx-refrain-*
          path: dist

      # Draft only: the release is published by hand after a look at it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find dist -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -exec cp -t release {} +
          cd release
          sha256sum -- * > SHA256SUMS
          ls -l
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nyx Refrain ${GITHUB_REF_NAME#v}" \
            --draft --verify-tag --generate-notes
