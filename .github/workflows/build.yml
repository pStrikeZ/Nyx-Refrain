# Full builds with scripts/build.sh (all five targets, NSIS installers, deb/rpm/Arch).
# - Manual run (intended for the dev branch): artifacts only; the version string carries
#   the commit hash, e.g. v0.9.1-g1a2b3c4.
# - Pushing a v* tag: same build with the clean version, then a draft GitHub Release with
#   the installers and packages attached.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: the version string checks whether HEAD is the release tag,
      # and the Linux packages take their timestamp from the last commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-gnu, aarch64-pc-windows-gnullvm, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, loongarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis libarchive-tools desktop-file-utils

      # package-linux.sh uses the git identity as the package maintainer.
      - name: Set packaging identity from the last commit
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"

      - name: Build
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nyx-refrain-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nyx-refrain-${{ github.sha }}
          path: dist

      # Draft only: the release is published by hand after a look at it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/packages
          sha256sum -- * > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nyx Refrain ${GITHUB_REF_NAME#v}" \
            --draft --verify-tag --generate-notes
