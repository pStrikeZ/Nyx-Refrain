# Full builds with scripts/build.sh (all five targets, NSIS installers, deb/rpm/Arch).
# - Manual run (intended for the dev branch): every installer and distro package is its
#   own artifact; the version string in the binaries carries the commit hash, e.g.
#   v0.9.1-g1a2b3c4.
# - Pushing a v* tag: same build with the clean version, then a draft GitHub Release with
#   the installers and packages attached.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history and tags: the version string checks whether HEAD is the release tag,
      # and the Linux packages take their timestamp from the last commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-gnu, aarch64-pc-windows-gnullvm, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, loongarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Install packaging tools
        run: |
          sudo apt-get update
          # llvm: build.sh inspects Windows DLL imports with llvm-readobj; GNU objdump
          # cannot read ARM64 PE files.
          sudo apt-get install -y nsis libarchive-tools desktop-file-utils llvm

      # package-linux.sh uses the git identity as the package maintainer.
      - name: Set packaging identity from the last commit
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"

      - name: Build
        run: ./scripts/build.sh

      # One artifact per installer / distro package, named after the file. Each step below
      # uploads the file this step found for its key.
      - name: Find packages
        id: pkg
        run: |
          shopt -s nullglob
          find_one() {
            local key="$1" pattern="$2" files
            files=(dist/packages/${pattern})
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "::error::expected exactly one package for ${pattern}, found ${#files[@]}"
              exit 1
            fi
            echo "${key}=$(basename "${files[0]}")" >> "${GITHUB_OUTPUT}"
          }
          find_one win_x64 '*-windows-x86_64-setup.exe'
          find_one win_arm64 '*-windows-arm64-setup.exe'
          find_one deb_amd64 '*_amd64.deb'
          find_one rpm_x86_64 '*.x86_64.rpm'
          find_one arch_x86_64 '*-x86_64.pkg.tar.zst'
          find_one deb_arm64 '*_arm64.deb'
          find_one rpm_aarch64 '*.aarch64.rpm'
          find_one arch_aarch64 '*-aarch64.pkg.tar.zst'
          find_one deb_loong64 '*_loong64.deb'
          find_one rpm_loongarch64 '*.loongarch64.rpm'
          find_one arch_loong64 '*-loong64.pkg.tar.zst'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.win_x64 }}
          path: dist/packages/${{ steps.pkg.outputs.win_x64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.win_arm64 }}
          path: dist/packages/${{ steps.pkg.outputs.win_arm64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.deb_amd64 }}
          path: dist/packages/${{ steps.pkg.outputs.deb_amd64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.rpm_x86_64 }}
          path: dist/packages/${{ steps.pkg.outputs.rpm_x86_64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.arch_x86_64 }}
          path: dist/packages/${{ steps.pkg.outputs.arch_x86_64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.deb_arm64 }}
          path: dist/packages/${{ steps.pkg.outputs.deb_arm64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.rpm_aarch64 }}
          path: dist/packages/${{ steps.pkg.outputs.rpm_aarch64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.arch_aarch64 }}
          path: dist/packages/${{ steps.pkg.outputs.arch_aarch64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.deb_loong64 }}
          path: dist/packages/${{ steps.pkg.outputs.deb_loong64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.rpm_loongarch64 }}
          path: dist/packages/${{ steps.pkg.outputs.rpm_loongarch64 }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.arch_loong64 }}
          path: dist/packages/${{ steps.pkg.outputs.arch_loong64 }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Each package artifact lands in dist/<file name>/<file name>.
      - uses: actions/download-artifact@v4
        with:
          pattern: nyx-refrain*
          path: dist

      # Draft only: the release is published by hand after a look at it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          find dist -type f \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -exec cp -t release {} +
          cd release
          sha256sum -- * > SHA256SUMS
          ls -l
          gh release create "${GITHUB_REF_NAME}" ./* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nyx Refrain ${GITHUB_REF_NAME#v}" \
            --draft --verify-tag --generate-notes
